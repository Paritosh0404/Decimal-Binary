<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Prediction App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 200px; padding: 5px; }
        button { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #45a049; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Weather Predictor</h1>

    <form id="weatherForm" method="POST" action="/predict">
        <div class="form-group">
            <label for="city">Select City:</label>
            <select name="city" id="city">
                <option value="Nagpur">Nagpur</option>
                <!-- Other cities can be added, but model is trained on Nagpur data -->
            </select>
        </div>

        <div class="form-group">
            <label for="month">Month (1-12):</label>
            <input type="number" name="month" id="month" min="1" max="12" value="6" required>
        </div>

        <div class="form-group">
            <label for="hour">Hour (0-23):</label>
            <input type="number" name="hour" id="hour" min="0" max="23" value="23" required>
        </div>

        <div class="form-group">
            <label for="daynight">Day/Night:</label>
            <select name="daynight" id="daynight">
                <option value="D">Day</option>
                <option value="N">Night</option>
            </select>
        </div>

        <div class="form-group">
            <label for="condition">Condition:</label>
            <select name="condition" id="condition">
                <option value="Haze">Haze</option>
                <option value="Clear">Clear</option>
                <option value="Cloudy">Cloudy</option>
                <!-- Add more conditions based on your dataset -->
            </select>
        </div>

        <div class="form-group">
            <label for="wdir_cardinal">Wind Direction:</label>
            <select name="wdir_cardinal" id="wdir_cardinal">
                <option value="E">East</option>
                <option value="W">West</option>
                <option value="N">North</option>
                <option value="S">South</option>
                <!-- Add more directions based on dataset -->
            </select>
        </div>

        <div class="form-group">
            <label for="clds">Cloud Cover Type:</label>
            <select name="clds" id="clds">
                <option value="SCT">Scattered</option>
                <option value="BKN">Broken</option>
                <option value="OVC">Overcast</option>
                <!-- Add more cloud types based on dataset -->
            </select>
        </div>

        <div class="form-group">
            <label for="temp">Temperature (°C):</label>
            <input type="number" name="temp" id="temp" step="0.1" required>
        </div>

        <div class="form-group">
            <label for="humidity">Humidity (%):</label>
            <input type="number" name="humidity" id="humidity" min="0" max="100" step="0.1" required>
        </div>

        <div class="form-group">
            <label for="windspeed">Windspeed (km/h):</label>
            <input type="number" name="windspeed" id="windspeed" step="0.1" required>
        </div>

        <div class="form-group">
            <label for="cloudcover">Cloud Cover (%):</label>
            <input type="number" name="cloudcover" id="cloudcover" min="0" max="100" step="0.1" required>
        </div>

        <div class="form-group">
            <label for="sealevelpressure">Sea Level Pressure (hPa):</label>
            <input type="number" name="sealevelpressure" id="sealevelpressure" step="0.1" required>
        </div>

        <div class="form-group">
            <label for="feelslike">Feels Like (°C):</label>
            <input type="number" name="feelslike" id="feelslike" step="0.1" required>
        </div>

        <div class="form-group">
            <label for="dew">Dew Point (°C):</label>
            <input type="number" name="dew" id="dew" step="0.1" required>
        </div>

        <div class="form-group">
            <label for="precipprob">Precipitation Probability (%):</label>
            <input type="number" name="precipprob" id="precipprob" min="0" max="100" step="0.1" required>
        </div>

        <div class="form-group">
            <label for="uvindex">UV Index:</label>
            <input type="number" name="uvindex" id="uvindex" step="0.1" required>
        </div>

        <button type="submit">Predict</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('weatherForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const response = await fetch('/predict', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            const resultDiv = document.getElementById('result');
            if (data.error) {
                resultDiv.innerHTML = `Error: ${data.error}`;
            } else {
                resultDiv.innerHTML = `Predicted Temperature: ${data.temperature}°F`;
            }
        });
    </script>

    <footer>
        <p>© 2025 Weather Prediction App | Developed by Decimal Binary</p>
    </footer>
</body>
</html>
